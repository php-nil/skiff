<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Skiff</title>
  <link rel="icon" type="image/svg+xml" href="/{{ prefix }}/static/favicon.svg?v=1">
  <script src="/{{ prefix }}/static/theme-init.js"></script>
  <link rel="stylesheet" href="/{{ prefix }}/static/skiff.css">
</head>
<body class="login-body">
<div class="login-card">
  <div class="login-brand"><span class="logo">▚</span> Skiff</div>
  <p class="sub">轻舟 · 极简服务器管理面板</p>
  {% if !error.is_empty() %}<div class="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/{{ prefix }}/login" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>用户名<input name="username" value="{{ username }}" autofocus required></label>
    <label>口令<input type="password" name="password" required></label>
    <label>动态码（启用 TOTP 后必填）<input name="otp" inputmode="numeric" autocomplete="one-time-code"></label>
    <button class="primary" type="submit">登录</button>
  </form>
  <p class="hint">初始口令见 <code>/www/skiff/initial-admin.txt</code>，可直接登录；建议登录后在「设置 → 口令」修改。</p>
</div>
</body>
</html>
