# 临时诊断工作流（用完即删）：定位 Release 打包时「plugins workspace 找不到根」的差异
#
# 已确认（run 41309778100）：cargo 直调、host/目标架构都正常；P5 只缺 musl gcc，
# 说明问题只出现在 cross 这条路径上。本轮专门对 cross 做 A/B。
name: DebugProbe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: rm -f .cargo/config.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      # 复刻 pack.sh：cwd=plugins，cross 直调
      - name: P7 plugins 目录内 cross 构建
        continue-on-error: true
        run: |
          cd plugins && pwd
          cross build --release --locked -p skiff-plugin-guard --target x86_64-unknown-linux-musl && echo P7_OK

      # 候选修法：从仓库根用 --manifest-path 调 cross
      - name: P8 仓库根 cross + --manifest-path
        continue-on-error: true
        run: |
          cross build --release --locked --manifest-path plugins/Cargo.toml \
            -p skiff-plugin-guard --target x86_64-unknown-linux-musl && echo P8_OK

      - name: 产物落点
        if: always()
        run: |
          ls -l plugins/target/x86_64-unknown-linux-musl/release/plugin 2>/dev/null || echo "plugins/target 无产物"
          ls -l target/x86_64-unknown-linux-musl/release/plugin 2>/dev/null || echo "根 target 无产物"
