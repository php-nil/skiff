# Skiff（轻舟）· 发布流水线
#
# 交付链路固定为「从 GitHub Release 下载安装包 → 解压 → 执行 install.sh」。
# 不再把开发机工作树直接搬到测试机当常态部署（源码拷贝/自编译只算开发调试）。
#
# 触发：
#   - `v*` 标签推送（正式发版用；日常测试**不要打新 tag**）
#   - workflow_dispatch 手动触发（测试期唯一入口：版本沿用 0.1.0，
#     产物上传/覆盖到同一个既有 Release，不新建 tag）
#
# 产物（每个架构一套，与 deploy/pack-release.sh 布局完全一致）：
#   skiff-<ver>-<target>.tar.gz           主程序 + skiff-plugin + install/uninstall +
#                                         skiff.service + config.toml.example + official/ +
#                                         checksums.txt + README.txt
#   skiff-<ver>-<target>.tar.gz.sha256    装机前先校验（单包摘要）
#   checksums.txt                         所有安装包的汇总摘要（Release 资产）
#
# 发布物**不做 detached 签名**（§11 决策 12，2026-11-01）：只用 SHA-256 摘要。
# 插件签名私钥缺失**不阻塞出包**：pack-release.sh 会生成临时签名身份并告警，
# 产物仅供测试；正式发行请配置 secrets.PLUGIN_SIGNING_KEY 以保持签名身份稳定。
#
# 为什么用 musl 静态：发行物要能在 Debian 11 / Ubuntu 22.04 / Rocky 9 上直接跑，
# 动态链接会把宿主 glibc 版本变成隐形依赖。aarch64 用 cross（自带交叉工具链镜像）。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        # 测试期沿用 0.1.0；留空只影响命名（用 night 占位，不挂 Release）
        description: "版本号（不带 v 前缀，如 0.1.0）；测试期沿用现有版本"
        required: false
        default: "0.1.0"
      publish:
        description: "上传到既有 GitHub Release（默认关，只出 workflow 产物）"
        type: boolean
        default: false
      release_tag:
        description: "目标 Release 标签（留空则用 v<version>）；标签必须已存在，本流水线不新建 tag"
        required: false
        default: ""
      skip_plugins:
        description: "不带官方插件出包（仅调试打包链路；正式发布物必须带插件）"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

# 同一 ref 上的新 dispatch 顶掉旧的：交叉编译动辄十几分钟，别让两轮排队互踩
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # 发布链路不取消进行中的构建，防止发出去半个包

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_VERSION: "1.98.1"

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      # 一个架构失败不影响另一个的产物，但整体仍然报红
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: 解析版本号
        id: ver
        run: |
          set -eu
          # 标签触发优先用标签名；dispatch 用输入
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            v="$GITHUB_REF_NAME"
          else
            v="${{ inputs.version }}"
          fi
          v="${v#v}"
          # 测试期留空：占位版本，只用于产物命名（不会挂 Release）
          if [ -z "$v" ]; then
            v="night"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本: $v"

      - name: 走 crates.io（仓库里的 .cargo/config.toml 是给国内开发机用的镜像）
        run: rm -f .cargo/config.toml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # cross 用它自己的镜像做交叉编译，runner 上只需要 docker
      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      # 官方插件随包发出时优先用正式签名身份；私钥缺失只告警、不阻塞出包
      # （pack-release.sh 会用临时身份签名并显著标记，产物仅供测试）。
      - name: 准备插件签名私钥（可选）
        env:
          PLUGIN_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          SKIP_PLUGINS: ${{ inputs.skip_plugins }}
        run: |
          set -eu
          if [ "$SKIP_PLUGINS" = "true" ]; then
            echo "::warning::skip_plugins=true：本次产物不带官方插件，不能当作正式发布物"
            exit 0
          fi
          if [ -z "$PLUGIN_KEY" ]; then
            echo "::warning::缺少 secrets.PLUGIN_SIGNING_KEY：按当前决定不阻塞出包，将使用临时签名身份（仅测试可用，正式发行前请配置该 secret）"
            exit 0
          fi
          umask 077
          printf '%s\n' "$PLUGIN_KEY" > "$RUNNER_TEMP/plugin-signing.key"
          # 不打印内容，只确认落盘成功（32 字节 hex 种子 = 64 字符 + 换行）
          wc -c < "$RUNNER_TEMP/plugin-signing.key"

      - name: 打包（构建 + 摘要由 pack-release.sh 统一负责）
        env:
          SKIP_PLUGINS: ${{ inputs.skip_plugins }}
        run: |
          set -eu
          set -- --version "${{ steps.ver.outputs.version }}" \
                 --target "${{ matrix.target }}" \
                 --out dist
          if [ "$SKIP_PLUGINS" = "true" ]; then
            set -- "$@" --skip-plugins
          elif [ -f "$RUNNER_TEMP/plugin-signing.key" ]; then
            set -- "$@" --plugin-key "$RUNNER_TEMP/plugin-signing.key"
          fi
          # 输出落盘再回显：失败时也要把完整日志打出来（cargo/cross 的报错在 stderr）
          if ! CARGO=cross sh deploy/pack-release.sh "$@" > "$RUNNER_TEMP/pack.log" 2>&1; then
            cat "$RUNNER_TEMP/pack.log"
            exit 1
          fi
          tail -n 15 "$RUNNER_TEMP/pack.log"

      # 验签工具要用宿主二进制：pack-release.sh 里的 skiff-plugin 是按目标架构编的
      # （musl 包内工具），arm64 那份 runner 上跑不起来。这里单独编宿主版本。
      - name: 构建宿主验签工具
        if: ${{ !inputs.skip_plugins }}
        run: cargo build --release --locked -p skiff-sdk --bin skiff-plugin

      - name: 自检产物（解包结构 + 静态链接 + 包内摘要 + 官方插件）
        env:
          SKIP_PLUGINS: ${{ inputs.skip_plugins }}
        run: |
          set -eu
          tar tzf dist/*.tar.gz | sort
          ( cd dist && sha256sum -c ./*.tar.gz.sha256 )
          mkdir -p "$RUNNER_TEMP/x" && tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/x"
          root=$(dirname "$(find "$RUNNER_TEMP/x" -name skiff -type f | head -1)")
          bin="$root/skiff"
          file "$bin"
          if readelf -l "$bin" | grep -q INTERP; then
            echo "::error::${{ matrix.target }} 产物不是静态链接"
            exit 1
          fi

          # 安装包必备件：缺一件就不算可交付的安装包
          for f in install.sh uninstall.sh skiff.service config.toml.example README.txt checksums.txt; do
            [ -f "$root/$f" ] || { echo "::error::安装包缺少 $f"; exit 1; }
          done
          # 包内摘要自校验（checksums.txt 覆盖包内除自身外的所有文件）
          ( cd "$root" && sha256sum -c checksums.txt )

          if [ "$SKIP_PLUGINS" = "true" ]; then
            echo "::warning::skip_plugins=true：本产物不带官方插件（结构自检跳过）"
            exit 0
          fi
          n=$(ls -1 "$root"/official/*.wbpkg | wc -l)
          [ "$n" = 4 ] || { echo "::error::发布包应带 4 个官方插件包（guard/monitor/files/cron），实得 $n"; exit 1; }
          [ -f "$root/official/public-key.txt" ] || { echo "::error::发布包缺少 official/public-key.txt"; exit 1; }
          PUB=$(tr -d '[:space:]' < "$root/official/public-key.txt")
          [ "${#PUB}" = 64 ] || { echo "::error::official/public-key.txt 不是 64 位 hex 公钥"; exit 1; }
          for p in "$root"/official/*.wbpkg; do
            # 打包机架构 != 载荷架构，必须 --arch；这条也是在验「架构没错位」
            ./target/release/skiff-plugin verify "$p" --pubkey "$PUB" \
              --arch "${{ matrix.arch }}" >/dev/null
            echo "验签通过：$(basename "$p")"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # 只在 inputs.publish 为 true 或标签推送时跑。
  # **不新建 tag**：目标 Release 的标签必须已存在；同名资产先删后传（--clobber），
  # 测试期反复 dispatch 覆盖同一 Release 不会因资产冲突失败。
  publish:
    name: 发布到 GitHub Release
    needs: build
    if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # 建 Release 需要写权限（其余 job 只读）
    steps:
      # v8 起：① 迁移到 ESM；② 校验和不匹配默认直接报错；③ 不再无条件解包，
      #     先看 Content-Type，非 zip 就跳过（就是为配合上面 v7 的 direct upload）。
      #     默认 false 的 merge-multiple 仍在，多产物合并进同一目录的用法不变。
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: 汇总摘要
        run: |
          set -eu
          ls -l dist
          # Release 级 checksums.txt：覆盖所有安装包（装机第一步校验）
          ( cd dist && sha256sum -- *.tar.gz > checksums.txt && cat checksums.txt )
      - name: 建/改 Release（只覆盖资产，不建 tag）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$RELEASE_TAG_INPUT" ]; then
            TAG="${RELEASE_TAG_INPUT#v}"
            TAG="v$TAG"
          else
            v="${VERSION_INPUT#v}"
            [ -n "$v" ] || v="night"
            TAG="v$v"
          fi

          # 测试期 / 正式发版都不允许这里新建 tag：标签必须已在仓库里
          # 用 API 而不是 git ls-remote：runner 的 checkout 只拉单 ref，远端查询不稳
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::标签 $TAG 不存在。本流水线不新建 tag：请先在仓库里创建（或改用 release_tag 指向既有 Release）。"
            exit 1
          fi
          if [ "$TAG" = "vnight" ]; then
            echo "::error::publish 需要真实版本号（night 占位版本拒绝发布）"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # 先删同名资产再传，避免不同平台/审批策略下的资产冲突
            gh release upload "$TAG" dist/* --clobber
          else
            # 标签已存在、Release 还没建：用 --verify-tag，绝不创建标签
            gh release create "$TAG" dist/* --verify-tag \
              --title "Skiff（轻舟）$TAG" \
              --notes '交付路径固定为「从 Release 下载安装包 → 解压 → 执行 install.sh」。装机：先 sha256sum -c checksums.txt，再解压、cd 进解压目录、sh install.sh。包内 official/ 是已签名的官方插件（guard/monitor/files/cron），安装时只复制到 /www/skiff/official/、不自动安装；公钥由首启自动信任。测试期沿用同一版本与同一 Release，手动 dispatch 覆盖资产，不新建 tag。Windows/无外网场景可加 --no-docker；国内网络可用 --registry-mirror <host> 配镜像加速。'
          fi

  # Dockerfile 是可选形态，但"能不能构建"必须有人验：这一步不 gate publish，
  # 失败会红但不拦发布（主形态是 systemd 直装）。
  docker:
    name: Docker 镜像可构建（可选形态）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # 镜像内 cargo 构建同样要走 crates.io：仓库 .cargo/config.toml 是给国内开发机的
      # 镜像源，不能让 CI 依赖 rsproxy 的可用性。清成空配置（不是删文件）——
      # Dockerfile 里 `COPY .cargo ./.cargo` 要求源存在，删掉会在 COPY 就炸。
      - name: 清掉国内镜像源（与其余 cargo job 的 rm -f 口径一致）
        run: printf '# CI 置空：走 crates.io（rsproxy 镜像仅供国内开发机，见 .cargo/config.toml 原文）\n' > .cargo/config.toml
      - run: docker build -f deploy/Dockerfile -t skiff:ci .
      - name: 自检镜像
        run: |
          set -eu
          docker run --rm skiff:ci version
          docker run --rm skiff:ci --help >/dev/null
