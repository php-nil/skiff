# Skiff（轻舟）· 发布流水线
#
# 【开发/测试阶段 · 2026-10-31】不发新版，这条流水线只作「概念验证」：
#   - 触发只剩手动 dispatch，`v*` 标签触发先摘掉（注释保留在下面，
#     真要发版时连同 publish 默认值一起放开）
#   - 默认**只构建 + 自检 + 传 workflow 产物**，不建 GitHub Release；
#     要真发布，手动 dispatch 时把 `publish` 勾成 true
#   这样跑这条流水线零副作用：能验 musl/cross/pack-release.sh 全链路，
#   但不会把半成品挂到 Release 页上。
#
# 产物（每个架构一套，与 deploy/pack-release.sh 的布局一致）：
#   skiff-<ver>-linux-<arch>.tar.gz          主程序 + skiff-plugin + install.sh + docker-bootstrap.sh + systemd 单元
#   skiff-<ver>-linux-<arch>.tar.gz.sha256   装机前先校验
#
# 发布物**不做 detached 签名**（§11 决策 12，2026-11-01）：只用 SHA-256 摘要。
# 原 `RELEASE_SIGNING_KEY_HEX` / `.sig` / `verify-file` 链路已整体移除。
#
# 为什么用 musl 静态：发行物要能在 Debian 11 / Ubuntu 22.04 / Rocky 9 上直接跑，
# 动态链接会把宿主 glibc 版本变成隐形依赖。aarch64 用 cross（自带交叉工具链镜像，
# 避免在 runner 上手工拼 aarch64 的 C 交叉编译器）。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        # 开发阶段没有版本号：留空即可，产物用 night 占位（只影响命名）。
        # 真发版（publish=true）必须填真实版本，占位版本会被 publish job 拒绝。
        description: "版本号（不带 v 前缀，如 0.1.0）；开发阶段留空即可"
        required: false
      publish:
        description: "建 GitHub Release（开发阶段默认关，只出 workflow 产物）"
        type: boolean
        default: false
      skip_plugins:
        description: "不带官方插件出包（仅调试打包链路；正式发布物必须带插件）"
        type: boolean
        default: false
  # 真要发版时放开这段（并把上面 publish 的 default 改回 true，或发版时手动勾选）：
  # push:
  #   tags: ["v*"]

permissions:
  contents: read

# 同一 ref 上的新 dispatch 顶掉旧的：交叉编译动辄十几分钟，别让两轮排队互踩
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # 发布链路不取消进行中的构建，防止发出去半个包

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_VERSION: "1.98.1"

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      # 一个架构失败不影响另一个的产物，但整体仍然报红
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: 解析版本号
        id: ver
        run: |
          set -eu
          v="${{ inputs.version }}"
          v="${v#v}"
          # 开发阶段留空：占位版本，只用于产物命名
          if [ -z "$v" ]; then
            v="night"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本: $v"

      - name: 走 crates.io（仓库里的 .cargo/config.toml 是给国内开发机用的镜像）
        run: rm -f .cargo/config.toml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # cross 用它自己的镜像做交叉编译，runner 上只需要 docker
      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      # 官方插件必须真签名才随包发出（plugins/pack.sh 用 0600 临时文件里的私钥
      # 回填 manifest.key_id 再打包）；私钥只在这台 runner 的内存/临时目录里存在。
      - name: 准备插件签名私钥
        env:
          PLUGIN_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          SKIP_PLUGINS: ${{ inputs.skip_plugins }}
        run: |
          set -eu
          if [ "$SKIP_PLUGINS" = "true" ]; then
            echo "::warning::skip_plugins=true：本次产物不带官方插件，不能当作正式发布物"
            exit 0
          fi
          if [ -z "$PLUGIN_KEY" ]; then
            echo "::error::缺少 secrets.PLUGIN_SIGNING_KEY：发布包必须携带已签名的官方插件（guard/monitor/nginx/files/cron）。"
            echo "::error::请在仓库 Settings → Secrets 配置该私钥；只是调试打包链路时可 dispatch 时勾选 skip_plugins。"
            exit 1
          fi
          umask 077
          printf '%s\n' "$PLUGIN_KEY" > "$RUNNER_TEMP/plugin-signing.key"
          # 不打印内容，只确认落盘成功（32 字节 hex 种子 = 64 字符 + 换行）
          wc -c < "$RUNNER_TEMP/plugin-signing.key"

      - name: 打包（构建 + 摘要由 pack-release.sh 统一负责）
        env:
          SKIP_PLUGINS: ${{ inputs.skip_plugins }}
        run: |
          set -eu
          set -- --version "${{ steps.ver.outputs.version }}" \
                 --target "${{ matrix.target }}" \
                 --out dist
          if [ "$SKIP_PLUGINS" = "true" ]; then
            set -- "$@" --skip-plugins
          else
            set -- "$@" --plugin-key "$RUNNER_TEMP/plugin-signing.key"
          fi
          # 输出落盘再回显：失败时也要把完整日志打出来（cargo/cross 的报错在 stderr）
          if ! CARGO=cross sh deploy/pack-release.sh "$@" > "$RUNNER_TEMP/pack.log" 2>&1; then
            cat "$RUNNER_TEMP/pack.log"
            exit 1
          fi
          tail -n 15 "$RUNNER_TEMP/pack.log"

      - name: 自检产物（解包结构 + 静态链接 + 官方插件）
        env:
          SKIP_PLUGINS: ${{ inputs.skip_plugins }}
        run: |
          set -eu
          tar tzf dist/*.tar.gz | sort
          ( cd dist && sha256sum -c ./*.tar.gz.sha256 )
          mkdir -p "$RUNNER_TEMP/x" && tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/x"
          bin=$(find "$RUNNER_TEMP/x" -name skiff -type f | head -1)
          file "$bin"
          if readelf -l "$bin" | grep -q INTERP; then
            echo "::error::${{ matrix.target }} 产物不是静态链接"
            exit 1
          fi

          # 官方插件：五个一个都不能少，且必须能用发布公钥验签通过。
          # 公钥从打包日志里取（pack.sh 末行打印，仅此一处给），不依赖任何密钥文件。
          if [ "$SKIP_PLUGINS" = "true" ]; then
            echo "::warning::skip_plugins=true：本产物不带官方插件（结构自检跳过）"
            exit 0
          fi
          n=$(ls -1 "$RUNNER_TEMP/x"/skiff-*/official/*.wbpkg | wc -l)
          [ "$n" = 5 ] || { echo "::error::发布包应带 5 个官方插件包（guard/monitor/nginx/files/cron），实得 $n"; exit 1; }
          PUB=$(grep -o 'hex): [0-9a-f]\{64\}' "$RUNNER_TEMP/pack.log" | tail -1 | awk '{print $2}')
          [ "${#PUB}" = 64 ] || { echo "::error::没能从打包日志里取到官方插件公钥"; exit 1; }
          for p in "$RUNNER_TEMP/x"/skiff-*/official/*.wbpkg; do
            # 打包机架构 != 载荷架构，必须 --arch；这条也是在验「架构没错位」
            ./target/release/skiff-plugin verify "$p" --pubkey "$PUB" \
              --arch "${{ matrix.arch }}" >/dev/null
            echo "验签通过：$(basename "$p")"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error
      # 注意：这里 @v7 与下面 download 的 @v8 版本号故意不对齐 ——
      #      download v8 与 upload v7 是同期发布的一对（v8 才认得 v7 新增的 direct upload），
      #      别按「上传下载要同版本号」的直觉去改。

  # 只在 inputs.publish 为 true 时跑。开发阶段跑 release 流水线 =
  # 只到 build + workflow 产物为止，GitHub Release 页保持干净。
  publish:
    name: 发布到 GitHub Release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # 建 Release 需要写权限（其余 job 只读）
    steps:
      # v8 起：① 迁移到 ESM；② 校验和不匹配默认直接报错；③ 不再无条件解包，
      #     先看 Content-Type，非 zip 就跳过（就是为配合上面 v7 的 direct upload）。
      #     默认 false 的 merge-multiple 仍在，多产物合并进同一目录的用法不变。
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: 汇总摘要
        run: |
          set -eu
          ls -l dist
          ( cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS )
      - name: 建/改 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 标签触发已摘（见文件头），这里只认 dispatch 的 version 输入
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -eu
          # 输入允许带/不带 v 前缀，统一成恰好一个 v 开头
          v="${VERSION_INPUT#v}"
          # 发布必须是真实版本号，开发占位版本不允许挂上 Release 页
          if [ -z "$v" ] || [ "$v" = "night" ]; then
            echo "::error::publish=true 时 version 必须填真实版本号（night 占位版本拒绝发布）"
            exit 1
          fi
          TAG="v$v"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Skiff（轻舟）$TAG" \
              --notes '装机：先 sha256sum -c 校摘要，再解包执行 sh install.sh。包内 official/ 是已签名的官方插件（guard/monitor/nginx/files/cron），装机只复制到 /var/lib/skiff/official/、不自动安装；安装前把打包日志里的「官方插件签名公钥(hex)」导入面板「设置 → 信任公钥」。Windows/无外网场景可加 --no-docker；国内网络可用 --registry-mirror <host> 配镜像加速。'
          fi

  # Dockerfile 是可选形态，但"能不能构建"必须有人验：这一步不 gate publish，
  # 失败会红但不拦发布（主形态是 systemd 直装）。
  docker:
    name: Docker 镜像可构建（可选形态）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # 镜像内 cargo 构建同样要走 crates.io：仓库 .cargo/config.toml 是给国内开发机的
      # 镜像源，不能让 CI 依赖 rsproxy 的可用性。清成空配置（不是删文件）——
      # Dockerfile 里 `COPY .cargo ./.cargo` 要求源存在，删掉会在 COPY 就炸。
      - name: 清掉国内镜像源（与其余 cargo job 的 rm -f 口径一致）
        run: printf '# CI 置空：走 crates.io（rsproxy 镜像仅供国内开发机，见 .cargo/config.toml 原文）\n' > .cargo/config.toml
      - run: docker build -f deploy/Dockerfile -t skiff:ci .
      - name: 自检镜像
        run: |
          set -eu
          docker run --rm skiff:ci version
          docker run --rm skiff:ci --help >/dev/null
