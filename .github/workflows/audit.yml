# 依赖安全公告（RustSec）
#
# 只在每周一和手动触发时跑，不挂 PR：
# 一旦某条公告命中，任何 PR 都会连带变红，反而掩盖了真正的回归。
# 有命中就修；确实无法修（上游未发新版）时，在下面加 `--ignore <RUSTSEC-ID>`
# 并写明理由 —— 不要默默关掉这条流水线。
name: Security Audit

on:
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: 走 crates.io（仓库里的 .cargo/config.toml 是给国内开发机用的镜像）
        run: rm -f .cargo/config.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
