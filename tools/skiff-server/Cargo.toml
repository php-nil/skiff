[package]
name = "skiff-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Skiff-server P0：商店清单 schema 校验与静态产物生成（无内核依赖、无原生 C 依赖）"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
ureq = { workspace = true }
rustls-pemfile = { workspace = true }
chrono = { workspace = true }
# `.wbpkg` 校验复用仓库唯一实现（xtask verify-pkg 同源），不另写验签。
skiff-pkgfmt = { path = "../../crates/pkgfmt" }

[dev-dependencies]
tempfile = { workspace = true }
# 进程内生成自签 CA / 服务器证书，验证 serve 的 https 链路（不触网）
rcgen = "0.12"
