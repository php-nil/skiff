<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>主机监控 · 历史采样</title>
<style>
  /* 默认深色；父页面下发 `light` 时由 app.js 写到 <html data-theme>。 */
  :root {
    color-scheme: dark;
    --ui-bg: #0b0d11;
    --ui-text: #d7dee8;
    --ui-muted: #8a97a8;
    --ui-surface: #121722;
    --ui-btn: #1b2230;
    --ui-line: #2a3444;
    --ui-line-soft: #1c2532;
    --ui-card-line: #202a38;
    --ui-warn: #f0b429;
    --ui-bad: #ff7b72;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --ui-bg: #f4f5f7;
    --ui-text: #101828;
    --ui-muted: #667085;
    --ui-surface: #ffffff;
    --ui-btn: #ffffff;
    --ui-line: #cfd5dd;
    --ui-line-soft: #e4e7ec;
    --ui-card-line: #e4e7ec;
    --ui-warn: #b54708;
    --ui-bad: #b42318;
  }
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--ui-bg); color: var(--ui-text); }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  button { background: var(--ui-btn); color: var(--ui-text); border: 1px solid var(--ui-line); border-radius: 6px;
           padding: 5px 12px; cursor: pointer; }
  .muted { color: var(--ui-muted); font-size: 12px; }
  h2 { font-size: 14px; margin: 16px 0 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--ui-line-soft); font-size: 13px; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--ui-muted); font-weight: 500; }
  #msg { font-size: 12px; color: var(--ui-warn); }
</style>
</head>
<body>
<p class="muted">只读 /proc 采样；CPU 使用率来自两次采样差值，历史点由内核 cron 每 5 分钟生成。</p>
<div class="row">
  <button id="refresh">刷新</button>
  <span id="msg"></span>
</div>
<div data-view="history">
  <h2>历史采样</h2>
  <table>
    <thead><tr><th>时间</th><th>CPU %</th><th>内存 %</th><th>负载 1m</th><th>入站</th><th>出站</th></tr></thead>
    <tbody id="history"><tr><td colspan="6" class="muted">暂无历史采样</td></tr></tbody>
  </table>
</div>
<script src="app.js"></script>
</body>
</html>
