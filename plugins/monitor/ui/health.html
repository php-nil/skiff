<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>系统状态</title>
<style>
  /* 默认深色；父页面下发 `light` 时由 health.js 写到 <html data-theme>。 */
  :root {
    color-scheme: dark;
    --ui-bg: #0b0d11;
    --ui-text: #d7dee8;
    --ui-muted: #8a97a8;
    --ui-bad: #ff7b72;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --ui-bg: #f4f5f7;
    --ui-text: #101828;
    --ui-muted: #667085;
    --ui-bad: #b42318;
  }
  body { margin: 0; padding: 8px 12px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--ui-bg); color: var(--ui-text); }
  .row { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  .k { color: var(--ui-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .v { font-size: 15px; font-weight: 600; }
  .bad .v { color: var(--ui-bad); }
  .muted { color: var(--ui-muted); font-size: 12px; }
  #empty { margin: 6px 0 0; color: var(--ui-muted); font-size: 12px; }
</style>
</head>
<body>
<div class="row" id="metrics" hidden>
  <div class="item"><span class="k">CPU</span><span class="v" id="cpu">-</span></div>
  <div class="item" id="mem-item"><span class="k">内存</span><span class="v" id="mem">-</span></div>
  <div class="item"><span class="k">负载</span><span class="v" id="load">-</span></div>
  <div class="item"><span class="k">运行</span><span class="v" id="uptime">-</span></div>
</div>
<p id="empty">正在读取采样…</p>
<script src="health.js"></script>
</body>
</html>
