<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>主机监控</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #0b0d11; color: #d7dee8; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  button { background: #1b2230; color: #d7dee8; border: 1px solid #2a3444; border-radius: 6px;
           padding: 5px 12px; cursor: pointer; }
  .muted { color: #8a97a8; font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .card { background: #121722; border: 1px solid #202a38; border-radius: 8px; padding: 10px 12px; }
  .card span { color: #8a97a8; font-size: 12px; }
  .card b { display: block; font-size: 20px; margin-top: 4px; }
  .bad b { color: #ff7b72; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid #1c2532; font-size: 13px; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #8a97a8; font-weight: 500; }
  #msg { font-size: 12px; color: #f0b429; }
</style>
</head>
<body>
<h1>主机监控</h1>
<p class="muted">只读 /proc 采样；CPU 使用率来自两次采样差值，历史点由内核 cron 每 5 分钟生成。</p>
<div class="row">
  <button id="refresh">刷新</button>
  <span id="msg"></span>
</div>
<div class="cards">
  <div class="card" id="c-cpu"><span>CPU</span><b>-</b></div>
  <div class="card" id="c-mem"><span>内存</span><b>-</b></div>
  <div class="card" id="c-load"><span>负载 (1/5/15)</span><b>-</b></div>
  <div class="card" id="c-net"><span>网卡入站</span><b>-</b></div>
  <div class="card" id="c-uptime"><span>运行时长</span><b>-</b></div>
  <div class="card" id="c-cpus"><span>CPU 核心</span><b>-</b></div>
</div>
<table>
  <thead><tr><th>时间</th><th>CPU %</th><th>内存 %</th><th>负载 1m</th><th>入站</th><th>出站</th></tr></thead>
  <tbody id="history"><tr><td colspan="6" class="muted">暂无历史采样</td></tr></tbody>
</table>
<script src="app.js"></script>
</body>
</html>
