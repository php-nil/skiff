<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>主机监控 · 总览</title>
<style>
  /* 默认深色；父页面下发 `light` 时由 app.js 写到 <html data-theme>。 */
  :root {
    color-scheme: dark;
    --ui-bg: #0b0d11;
    --ui-text: #d7dee8;
    --ui-muted: #8a97a8;
    --ui-surface: #121722;
    --ui-btn: #1b2230;
    --ui-line: #2a3444;
    --ui-line-soft: #1c2532;
    --ui-card-line: #202a38;
    --ui-warn: #f0b429;
    --ui-bad: #ff7b72;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --ui-bg: #f4f5f7;
    --ui-text: #101828;
    --ui-muted: #667085;
    --ui-surface: #ffffff;
    --ui-btn: #ffffff;
    --ui-line: #cfd5dd;
    --ui-line-soft: #e4e7ec;
    --ui-card-line: #e4e7ec;
    --ui-warn: #b54708;
    --ui-bad: #b42318;
  }
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--ui-bg); color: var(--ui-text); }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  button { background: var(--ui-btn); color: var(--ui-text); border: 1px solid var(--ui-line); border-radius: 6px;
           padding: 5px 12px; cursor: pointer; }
  .muted { color: var(--ui-muted); font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .card { background: var(--ui-surface); border: 1px solid var(--ui-card-line); border-radius: 8px; padding: 10px 12px; }
  .card span { color: var(--ui-muted); font-size: 12px; }
  .card b { display: block; font-size: 20px; margin-top: 4px; }
  .bad b { color: var(--ui-bad); }
  #msg { font-size: 12px; color: var(--ui-warn); }
</style>
</head>
<body>
<p class="muted">只读 /proc 采样；CPU 使用率来自两次采样差值，历史点由内核调度器每 5 分钟生成。</p>
<div class="row">
  <button id="refresh">刷新</button>
  <span id="msg"></span>
</div>
<div class="cards" data-view="overview">
  <div class="card" id="c-cpu"><span>CPU</span><b>-</b></div>
  <div class="card" id="c-mem"><span>内存</span><b>-</b></div>
  <div class="card" id="c-load"><span>负载 (1/5/15)</span><b>-</b></div>
  <div class="card" id="c-net"><span>网卡入站</span><b>-</b></div>
  <div class="card" id="c-net-tx"><span>网卡出站</span><b>-</b></div>
  <div class="card" id="c-uptime"><span>运行时长</span><b>-</b></div>
  <div class="card" id="c-cpus"><span>CPU 核心</span><b>-</b></div>
</div>
<script src="app.js"></script>
</body>
</html>
