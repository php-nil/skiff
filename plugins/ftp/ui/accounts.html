<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FTP 管理 · 账号</title>
<link rel="stylesheet" href="base.css">
</head>
<body data-view="accounts">
<div class="page-head">
  <h1>FTP 账号</h1>
  <p class="sub">账号只能访问所属站点的 <span class="mono">index/</span>；同名站点多账号共用该站点运行用户，站点之间由 chroot 隔离。</p>
  <div class="actions">
    <button id="btn-install-inline" style="display:none">安装并启用 FTP 服务</button>
    <button id="btn-config">服务配置</button>
    <button id="btn-new" class="primary">新建账号</button>
  </div>
</div>

<div class="bar">
  <span id="status-line" class="muted">正在读取服务状态…</span>
  <span class="grow"></span>
  <button id="btn-refresh">刷新</button>
</div>

<div class="toolbar">
  <input class="search" type="search" id="q" placeholder="搜索站点 / 登录名 / 根目录">
</div>

<div class="table-wrap">
  <table>
    <colgroup>
      <col style="width:18%"><col style="width:14%"><col style="width:9%">
      <col style="width:20%"><col style="width:9%"><col style="width:16%"><col style="width:220px">
    </colgroup>
    <thead>
      <tr><th>站点</th><th>登录名</th><th>uid:gid</th><th>根目录</th><th>状态</th><th>最后登录 / 备注</th><th>操作</th></tr>
    </thead>
    <tbody id="accounts"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
  </table>
</div>
<div id="unsupported" class="note"></div>
<div class="note">
  密码不会回显到列表或日志；新建与重置密码都在弹窗内完成。禁用账号只会让登录失败，账号记录与站点目录保留；
  最后登录 pure-ftpd 用户库不记录，列表明确显示「不可得」；配额/速率列为后续项。
</div>
<div id="dialog-host"></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
