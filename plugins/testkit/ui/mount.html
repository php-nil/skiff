<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>测试台 · 概览槽位</title>
<style>
  :root {
    color-scheme: dark;
    --ui-bg: #0b0d11; --ui-text: #d7dee8; --ui-muted: #8a97a8; --ui-surface: #121722;
    --ui-btn: #1b2230; --ui-btn-hover: #232c3c; --ui-line: #2a3444;
    --ui-ok: #7ee787; --ui-bad: #ff7b72;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --ui-bg: #f4f5f7; --ui-text: #101828; --ui-muted: #667085; --ui-surface: #ffffff;
    --ui-btn: #ffffff; --ui-btn-hover: #f0f2f5; --ui-line: #cfd5dd;
    --ui-ok: #15803d; --ui-bad: #b42318;
  }
  body { margin: 0; padding: 10px 12px; font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--ui-bg); color: var(--ui-text); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { background: var(--ui-btn); color: var(--ui-text); border: 1px solid var(--ui-line); border-radius: 6px;
           padding: 3px 10px; cursor: pointer; }
  button:hover { background: var(--ui-btn-hover); }
  #state { color: var(--ui-muted); font-size: 12px; }
  #state.ok { color: var(--ui-ok); }
  #state.bad { color: var(--ui-bad); }
</style>
</head>
<body>
<button id="mount-check">测试台槽位自检</button>
<span id="state">等待调用…</span>
<script src="mount.js"></script>
</body>
</html>
