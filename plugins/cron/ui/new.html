<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>计划任务 · 新建任务</title>
<link rel="stylesheet" href="base.css">
<!-- 主题变量内联兜底：插件页面只依赖自身资源，父页面未下发主题时保持深色。 -->
<style>
  :root {
    color-scheme: dark;
    --ui-bg: #0b0d11;
    --ui-text: #d7dee8;
    --ui-muted: #8a97a8;
    --ui-surface: #121722;
    --ui-btn: #1b2230;
    --ui-btn-hover: #232c3c;
    --ui-line: #2a3444;
    --ui-line-soft: #1c2532;
    --ui-ok: #7ee787;
    --ui-warn: #f0b429;
    --ui-bad: #ff7b72;
    --ui-danger-line: #5a2226;
    --ui-danger-text: #ff9b90;
    --ui-hit: #16324a;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --ui-bg: #f4f5f7;
    --ui-text: #101828;
    --ui-muted: #667085;
    --ui-surface: #ffffff;
    --ui-btn: #ffffff;
    --ui-btn-hover: #f0f2f5;
    --ui-line: #cfd5dd;
    --ui-line-soft: #e4e7ec;
    --ui-ok: #15803d;
    --ui-warn: #b54708;
    --ui-bad: #b42318;
    --ui-danger-line: #f3b4ae;
    --ui-danger-text: #b42318;
    --ui-hit: #eff6ff;
  }
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--ui-bg); color: var(--ui-text); }
</style>
</head>
<body>
<div class="page-head">
  <p class="sub">
    弹窗内一次填写名称、目标与调度；保存后任务定义写入<strong>内核调度器</strong>，按服务器本地时区执行。
  </p>
  <div class="actions">
    <button id="btn-new" class="primary">新建任务</button>
  </div>
</div>
<div id="msg" class="muted"></div>
<div class="card">
  <div class="empty" id="new-hint">
    新建任务使用弹窗完成，不会跳转到其他页面；关闭弹窗后可再次点击右上角「新建任务」。
  </div>
</div>
<div id="editor-host"></div>
<script src="app.js"></script>
</body>
</html>
