<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>计划任务 · 新建任务</title>
<style>
  /* 默认深色；父页面下发 `light` 时由 app.js 写到 <html data-theme>。 */
  :root {
    color-scheme: dark;
    --ui-bg: #0b0d11;
    --ui-text: #d7dee8;
    --ui-muted: #8a97a8;
    --ui-surface: #121722;
    --ui-btn: #1b2230;
    --ui-btn-hover: #232c3c;
    --ui-line: #2a3444;
    --ui-line-soft: #1c2532;
    --ui-ok: #7ee787;
    --ui-warn: #f0b429;
    --ui-bad: #ff7b72;
    --ui-danger-line: #5a2226;
    --ui-danger-text: #ff9b90;
    --ui-hit: #16324a;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --ui-bg: #f4f5f7;
    --ui-text: #101828;
    --ui-muted: #667085;
    --ui-surface: #ffffff;
    --ui-btn: #ffffff;
    --ui-btn-hover: #f0f2f5;
    --ui-line: #cfd5dd;
    --ui-line-soft: #e4e7ec;
    --ui-ok: #15803d;
    --ui-warn: #b54708;
    --ui-bad: #b42318;
    --ui-danger-line: #f3b4ae;
    --ui-danger-text: #b42318;
    --ui-hit: #eff6ff;
  }
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--ui-bg); color: var(--ui-text); }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h2 { font-size: 14px; margin: 16px 0 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  button { background: var(--ui-btn); color: var(--ui-text); border: 1px solid var(--ui-line); border-radius: 6px;
           padding: 5px 12px; cursor: pointer; }
  button:hover { background: var(--ui-btn-hover); }
  input[type=text] { background: var(--ui-surface); color: var(--ui-text); border: 1px solid var(--ui-line); border-radius: 6px;
                     padding: 5px 8px; min-width: 150px; }
  select { background: var(--ui-surface); color: var(--ui-text); border: 1px solid var(--ui-line); border-radius: 6px; padding: 5px 8px; }
  textarea { width: 100%; min-height: 54px; box-sizing: border-box; background: var(--ui-surface); color: var(--ui-text);
             border: 1px solid var(--ui-line); border-radius: 6px; padding: 6px 8px; font: 12px/1.5 ui-monospace,
             SFMono-Regular, Consolas, monospace; resize: vertical; }
  .muted { color: var(--ui-muted); font-size: 12px; }
  code { background: var(--ui-surface); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .ok { color: var(--ui-ok); } .warn { color: var(--ui-warn); } .bad { color: var(--ui-bad); }
  #msg { min-height: 20px; font-size: 12px; }
  .card { border: 1px solid var(--ui-line-soft); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>计划任务 · 新建任务</h1>
<p class="muted">
  任务只调用<strong>插件接口</strong>，不写 crontab、不执行宿主命令。能否调通由内核判定：
  计划任务需被授予 <code>interop:call</code> 与目标插件的 <code>plugin:</code> 对象授权。
</p>
<div class="row">
  <button id="refresh">刷新</button>
  <span id="msg" class="muted"></span>
</div>
<div data-view="new">
  <h2>新增 / 更新任务</h2>
  <div class="card">
    <div class="row">
      <input type="text" id="new-name" placeholder="任务名，例如 网站配置每日备份">
      <input type="text" id="new-expr" placeholder="0 3 * * *" style="min-width:120px">
      <span class="muted">5 段 cron：分 时 日 月 周（本地时区）</span>
    </div>
    <div class="row">
      <select id="new-target"></select>
      <input type="text" id="new-method" placeholder="方法，例如 backup">
      <input type="text" id="new-key" placeholder="幂等 key（可空）" style="min-width:130px">
      <button id="create">保存任务</button>
    </div>
    <textarea id="new-params" placeholder='调用参数（JSON 对象，可空），例如 {"name":"example.com"}'></textarea>
    <p class="muted" id="targets-note">可调度目标来自内核目录；看不到目标说明尚未授予 <code>plugin:</code> 授权。</p>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
