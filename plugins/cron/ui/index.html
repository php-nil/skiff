<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>计划任务</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #0b0d11; color: #d7dee8; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h2 { font-size: 14px; margin: 16px 0 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  button { background: #1b2230; color: #d7dee8; border: 1px solid #2a3444; border-radius: 6px;
           padding: 5px 12px; cursor: pointer; }
  button:hover { background: #232c3c; }
  button.danger { border-color: #5a2226; color: #ff9b90; }
  button.mini { padding: 2px 8px; font-size: 12px; }
  input[type=text] { background: #121722; color: #d7dee8; border: 1px solid #2a3444; border-radius: 6px;
                     padding: 5px 8px; min-width: 150px; }
  select { background: #121722; color: #d7dee8; border: 1px solid #2a3444; border-radius: 6px; padding: 5px 8px; }
  textarea { width: 100%; min-height: 54px; box-sizing: border-box; background: #121722; color: #d7dee8;
             border: 1px solid #2a3444; border-radius: 6px; padding: 6px 8px; font: 12px/1.5 ui-monospace,
             SFMono-Regular, Consolas, monospace; resize: vertical; }
  .muted { color: #8a97a8; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #1c2532; font-size: 13px;
           vertical-align: top; }
  th { color: #8a97a8; font-weight: 500; }
  tr.hit { background: #16324a; }
  code { background: #121722; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .ok { color: #7ee787; } .warn { color: #f0b429; } .bad { color: #ff7b72; }
  #msg { min-height: 20px; font-size: 12px; }
  .card { border: 1px solid #1c2532; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>计划任务</h1>
<p class="muted">
  任务只调用<strong>插件接口</strong>，不写 crontab、不执行宿主命令。能否调通由内核判定：
  计划任务需被授予 <code>interop:call</code> 与目标插件的 <code>plugin:</code> 对象授权。
</p>
<div class="row">
  <button id="refresh">刷新</button>
  <span id="msg" class="muted"></span>
</div>

<h2>新增 / 更新任务</h2>
<div class="card">
  <div class="row">
    <input type="text" id="new-name" placeholder="任务名，例如 网站配置每日备份">
    <input type="text" id="new-expr" placeholder="0 3 * * *" style="min-width:120px">
    <span class="muted">5 段 cron：分 时 日 月 周（本地时区）</span>
  </div>
  <div class="row">
    <select id="new-target"></select>
    <input type="text" id="new-method" placeholder="方法，例如 backup">
    <input type="text" id="new-key" placeholder="幂等 key（可空）" style="min-width:130px">
    <button id="create">保存任务</button>
  </div>
  <textarea id="new-params" placeholder='调用参数（JSON 对象，可空），例如 {"name":"example.com"}'></textarea>
  <p class="muted" id="targets-note">可调度目标来自内核目录；看不到目标说明尚未授予 <code>plugin:</code> 授权。</p>
</div>

<h2>任务列表</h2>
<table>
  <thead><tr><th>任务</th><th>表达式 / 下次</th><th>目标</th><th>来源</th><th>上次</th><th>操作</th></tr></thead>
  <tbody id="jobs"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
</table>
<script src="app.js"></script>
</body>
</html>
