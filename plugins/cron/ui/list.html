<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>计划任务 · 任务列表</title>
<style>
  /* 默认深色；父页面下发 `light` 时由 app.js 写到 <html data-theme>。 */
  :root {
    color-scheme: dark;
    --ui-bg: #0b0d11;
    --ui-text: #d7dee8;
    --ui-muted: #8a97a8;
    --ui-surface: #121722;
    --ui-btn: #1b2230;
    --ui-btn-hover: #232c3c;
    --ui-line: #2a3444;
    --ui-line-soft: #1c2532;
    --ui-ok: #7ee787;
    --ui-warn: #f0b429;
    --ui-bad: #ff7b72;
    --ui-danger-line: #5a2226;
    --ui-danger-text: #ff9b90;
    --ui-hit: #16324a;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --ui-bg: #f4f5f7;
    --ui-text: #101828;
    --ui-muted: #667085;
    --ui-surface: #ffffff;
    --ui-btn: #ffffff;
    --ui-btn-hover: #f0f2f5;
    --ui-line: #cfd5dd;
    --ui-line-soft: #e4e7ec;
    --ui-ok: #15803d;
    --ui-warn: #b54708;
    --ui-bad: #b42318;
    --ui-danger-line: #f3b4ae;
    --ui-danger-text: #b42318;
    --ui-hit: #eff6ff;
  }
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--ui-bg); color: var(--ui-text); }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h2 { font-size: 14px; margin: 16px 0 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  button { background: var(--ui-btn); color: var(--ui-text); border: 1px solid var(--ui-line); border-radius: 6px;
           padding: 5px 12px; cursor: pointer; }
  button:hover { background: var(--ui-btn-hover); }
  button.danger { border-color: var(--ui-danger-line); color: var(--ui-danger-text); }
  button.mini { padding: 2px 8px; font-size: 12px; }
  .muted { color: var(--ui-muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--ui-line-soft); font-size: 13px;
           vertical-align: top; }
  th { color: var(--ui-muted); font-weight: 500; }
  tr.hit { background: var(--ui-hit); }
  code { background: var(--ui-surface); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .ok { color: var(--ui-ok); } .warn { color: var(--ui-warn); } .bad { color: var(--ui-bad); }
  #msg { min-height: 20px; font-size: 12px; }
  .card { border: 1px solid var(--ui-line-soft); border-radius: 8px; padding: 10px 12px; margin: 8px 0 12px;
          background: var(--ui-surface); }
  .sched-box { border: 1px solid var(--ui-line-soft); border-radius: 8px; padding: 8px 10px; margin: 2px 0 8px;
               background: var(--ui-bg); }
  .sched-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .sched-line select, .sched-line input[type=time], .sched-line input[type=number] {
    background: var(--ui-surface); color: var(--ui-text); border: 1px solid var(--ui-line); border-radius: 6px;
    padding: 5px 8px; }
  .sched-line input[type=number] { width: 72px; }
  .sched-line .sched-expr { min-width: 210px; flex: 1; background: var(--ui-surface); color: var(--ui-text);
    border: 1px solid var(--ui-line); border-radius: 6px; padding: 5px 8px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  .sched-line label.sched-day { font-size: 12px; color: var(--ui-muted); white-space: nowrap; }
  .sched-preview { font-size: 12px; color: var(--ui-ok); }
  .sched-error { color: var(--ui-bad); font-size: 12px; min-height: 18px; }
</style>
</head>
<body>
<p class="muted">
  任务由<strong>内核调度器</strong>统一执行：内置任务（站点备份 / 数据库整理）在进程内跑，
  插件任务经 Supervisor 调用目标接口。本页只是管理视图——不写 crontab、不执行宿主命令。
  任务定义与历史都落在内核库，插件重启不会丢。调度按<strong>服务器本地时区</strong>执行，
  不支持秒级（6 段）与 <code>@reboot</code>。
</p>
<div class="row">
  <button id="refresh">刷新</button>
  <span id="msg" class="muted"></span>
</div>
<div data-view="list">
  <h2>任务列表</h2>
  <div class="card" id="edit-card" hidden>
    <div class="row">
      <strong>修改调度</strong>
      <span id="edit-title" class="muted"></span>
      <span id="edit-msg" class="muted"></span>
    </div>
    <div id="edit-sched"></div>
    <div class="row">
      <button id="edit-save">保存调度</button>
      <button id="edit-cancel">取消</button>
    </div>
  </div>
  <table>
    <thead><tr><th>任务</th><th>表达式 / 下次</th><th>目标</th><th>来源</th><th>上次</th><th>操作</th></tr></thead>
    <tbody id="jobs"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
  </table>
</div>
<script src="app.js"></script>
</body>
</html>
