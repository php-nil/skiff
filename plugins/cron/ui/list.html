<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>计划任务 · 任务列表</title>
<link rel="stylesheet" href="base.css">
<!-- 主题变量内联兜底：插件页面只依赖自身资源，父页面未下发主题时保持深色。 -->
<style>
  :root {
    color-scheme: dark;
    --ui-bg: #0b0d11;
    --ui-text: #d7dee8;
    --ui-muted: #8a97a8;
    --ui-surface: #121722;
    --ui-btn: #1b2230;
    --ui-btn-hover: #232c3c;
    --ui-line: #2a3444;
    --ui-line-soft: #1c2532;
    --ui-ok: #7ee787;
    --ui-warn: #f0b429;
    --ui-bad: #ff7b72;
    --ui-danger-line: #5a2226;
    --ui-danger-text: #ff9b90;
    --ui-hit: #16324a;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --ui-bg: #f4f5f7;
    --ui-text: #101828;
    --ui-muted: #667085;
    --ui-surface: #ffffff;
    --ui-btn: #ffffff;
    --ui-btn-hover: #f0f2f5;
    --ui-line: #cfd5dd;
    --ui-line-soft: #e4e7ec;
    --ui-ok: #15803d;
    --ui-warn: #b54708;
    --ui-bad: #b42318;
    --ui-danger-line: #f3b4ae;
    --ui-danger-text: #b42318;
    --ui-hit: #eff6ff;
  }
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--ui-bg); color: var(--ui-text); }
</style>
</head>
<body>
<div class="page-head">
  <p class="sub">
    由<strong>内核调度器</strong>统一执行：任务定义与历史落在内核库，插件重启不丢；调度按
    <strong>服务器本地时区</strong>执行，不支持秒级（6 段）与 <code>@reboot</code>。
  </p>
  <div class="actions">
    <button id="btn-new" class="primary">新建任务</button>
  </div>
</div>
<div id="msg" class="muted"></div>
<div class="toolbar">
  <input class="search" type="search" id="q" placeholder="搜索名称 / ID / 目标 / 方法">
  <select id="flt">
    <option value="all">全部任务</option>
    <option value="enabled">已启用</option>
    <option value="disabled">已停用</option>
    <option value="builtin">内置任务</option>
    <option value="own">本面板创建</option>
    <option value="other">其他来源</option>
  </select>
  <span class="spacer"></span>
  <button id="refresh">刷新</button>
</div>
<div data-view="list">
  <div class="table-wrap">
    <table>
      <colgroup>
        <col style="width:26%"><col style="width:24%"><col style="width:16%">
        <col style="width:9%"><col style="width:12%"><col style="width:220px">
      </colgroup>
      <thead>
        <tr><th>任务</th><th>调度 / 下次</th><th>目标</th><th>来源</th><th>上次</th><th>操作</th></tr>
      </thead>
      <tbody id="jobs"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>
</div>
<div id="editor-host"></div>
<script src="app.js"></script>
</body>
</html>
